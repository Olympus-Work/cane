name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan full history of this commit
        # HEAD only: other fetched branches are scanned by their own runs.
        # HEAD's history includes main, and a PR run checks out the merge commit,
        # so a secret already on main still fails every later run until removed.
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --verbose --log-opts="HEAD" .

  build:
    runs-on: ubuntu-latest
    # Throwaway CI container, not a secret.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Schema and migrations in sync
        run: pnpm --filter @cane/server exec drizzle-kit generate --name drift && test -z "$(git status --porcelain)"
      - name: Migrate up, down, up on a fresh database
        run: pnpm --filter @cane/server db:migrate up && pnpm --filter @cane/server db:migrate down && pnpm --filter @cane/server db:migrate up
      - run: pnpm audit --prod --audit-level high
